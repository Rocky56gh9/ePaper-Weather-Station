# Copy to config.ini (install.sh does this for you). config.ini is git-ignored.

[openweather]
# API key from https://home.openweathermap.org/api_keys
# Your account needs a One Call API 3.0 subscription (the free tier covers this station).
api_key = YOUR_OPENWEATHER_API_KEY

# Decimal degrees, e.g. 51.51 and -0.13 for London. Two decimal places (about 1 km) is plenty.
latitude = YOUR_LATITUDE
longitude = YOUR_LONGITUDE

# imperial (°F, mph) or metric (°C, m/s)
units = imperial

[display]
# waveshare_3in52 (Waveshare 3.52" e-Paper HAT) or inky_what (Pimoroni Inky wHAT)
screen = waveshare_3in52

# 0, or 180 if the display is mounted upside down
rotate = 0

# Hours to leave the display alone, as start-end on a 24-hour clock (0-5 means midnight
# until 5am; 23-6 also works). Leave blank to update around the clock. The nightly deep
# clean still runs.
quiet_hours = 0-5

# Hour the left panel switches from today's high/low to tonight's low and rain chance.
evening_starts = 18

# Callouts appear only when conditions cross these values, in your units. Leave blank for
# the defaults: wind 15 mph / 7 m/s, gusts 25 mph / 11 m/s, UV 6, temp_swing 10°F / 6°C.
wind =
gusts =
uv_index =
# Show "colder/warmer tomorrow" when tomorrow's high differs from today's by this much.
temp_swing =

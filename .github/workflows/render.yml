# Runs the tests and renders the demo screen on the oldest and newest supported Pillow,
# so layout or Pillow API breakage shows up here instead of on someone's wall.
name: Test and render

on: [push, pull_request]

jobs:
  render:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - python: "3.9"     # Raspberry Pi OS Bullseye
            pillow: "8.1.2"
          - python: "3.13"    # current Pillow
            pillow: ""
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: pip install requests "pillow${{ matrix.pillow && format('=={0}', matrix.pillow) || '' }}"
      - run: bash -n install.sh
      - run: python -m unittest discover tests -v
      - run: python weather_station.py --demo --preview preview.png
      - run: python weather_station.py --demo --screen inky_what --preview preview-inky.png
      - uses: actions/upload-artifact@v7
        with:
          name: preview-python${{ matrix.python }}
          path: preview*.png
